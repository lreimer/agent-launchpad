# Only listen on the loopback interface: the hook endpoints can approve tool executions.
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.test-port=0

# Long-polling approvals must outlive the default idle timeout.
quarkus.http.idle-timeout=15M

quarkus.log.category."dev.ops.tools".level=INFO

# Launchpad Mini MK2 MIDI device
launchpad.midi.enabled=true
launchpad.midi.device-name=Launchpad Mini

# Interactive approvals (PreToolUse / PermissionRequest)
launchpad.approval.timeout=PT2M
launchpad.approval.tool-pattern=.*

# Context window gauge (right column)
launchpad.context.window-tokens=200000

# Stream telemetry ripple (row 8): approx. tokens per lit pad
launchpad.stream.tokens-per-pad=100

# LED render loop interval
launchpad.render.interval=0.125s

# Optional OS commands triggered by the top row buttons, comma separated argv, e.g.
# launchpad.actions.emergency-stop-command=pkill,-INT,-f,claude
# launchpad.actions.compact-command=tmux,send-keys,-t,claude,/compact,Enter

%test.launchpad.midi.enabled=false
%test.launchpad.approval.timeout=PT5S
